name = "podium-feedback"
main = "src/worker.js"
compatibility_date = "2026-08-08"

# 미리보기 URL(*-podium-feedback...)은 만들지 않는다. 같은 코드가 여러 주소로 열려 있을
# 이유가 없고, 그 주소들은 CORS 허용 목록에도 없어 혼란만 준다.
#
# ★ 최상위 설정은 반드시 [[...]] 머리말 **위에** 둘 것. TOML은 다음 머리말까지가 한 블록이라,
#   파일 끝에 붙이면 kv_namespaces 안으로 들어가 "Unexpected fields" 경고가 난다 (2026-08-08).
preview_urls = false

# 비밀값은 여기 적지 않는다. 커밋되기 때문이다.
#   npx wrangler secret put ADMIN_KEY
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID

# KV 네임스페이스 — id 는 `npx wrangler kv namespace create FEEDBACK` 가 찍어 준 값.
# id 는 비밀이 아니다(계정 인증 없이는 못 읽는다).
[[kv_namespaces]]
binding = "FEEDBACK"
id = "9cef89cc702c4ae6acdc27b81b87842a"
