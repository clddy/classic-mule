name: 포디엄 일일 크롤

# 매일 18:00 KST 자동 크롤 → 정적 생성 → data·페이지 커밋·푸시 (GitHub Pages 반영).
# 로컬 PC 스케줄러를 대체한다 — PC가 꺼져 있어도 수집이 돈다.
on:
  schedule:
    - cron: '0 9 * * *'      # 09:00 UTC = 18:00 KST (Actions 크론은 부하 시 수 분~수십 분 지연될 수 있음)
  workflow_dispatch: {}       # 저장소 Actions 탭에서 수동 실행 버튼

# 데이터·정적 산출물을 저장소에 되커밋해야 하므로 쓰기 권한 필요
permissions:
  contents: write

# 수동+정기 실행이 겹쳐도 서로 밀어내지 않게 (푸시 충돌 방지)
concurrency:
  group: podium-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      PYTHONIOENCODING: utf-8
      # 값은 저장소 Settings → Secrets and variables → Actions 에서 주입 (코드엔 없음)
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HIBRAIN_ID: ${{ secrets.HIBRAIN_ID }}
      HIBRAIN_PW: ${{ secrets.HIBRAIN_PW }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Tesseract 한국어 OCR 설치
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-kor

      - name: 파이썬 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright 크롬 설치
        run: python -m playwright install --with-deps chromium

      - name: 크롤 실행 (수집 → 마감 추적 → 정적 생성)
        run: python crawler/main.py

      - name: 소스 노트 내보내기 (로컬 볼트 없으면 자동 skip)
        run: python crawler/export_sources_md.py || true

      - name: 변경분 커밋·푸시
        run: |
          git config user.name  "podium-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data p jobs.html index.html sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "auto: crawl $(date +%F) [skip ci]"
            git push
          fi
