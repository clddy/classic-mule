<div class="page-head">
  <div class="container">
    <h1>내 프로필 관리</h1>
    <p class="desc">확인 코드로 수정하거나 지웁니다</p>
  </div>
</div>

<main class="container" style="max-width:640px;padding-block:24px 48px">
  <form id="pm-auth">
    <label class="pf-l">프로필 번호
      <input name="id" maxlength="32" placeholder="등록할 때 받은 번호" required></label>
    <label class="pf-l">확인 코드
      <input name="token" maxlength="40" placeholder="pxk2-9mfa-vt7d-3xqw" required></label>
    <button type="submit" class="btn-primary">불러오기</button>
    <p id="pm-msg" style="margin-top:12px;font-size:0.88rem"></p>
  </form>

  <div id="pm-edit" hidden>
    <p id="pm-status" style="font-size:0.88rem;color:#6b6154;margin-bottom:14px"></p>
    <form id="pm-form">
      <label class="pf-l">이름 또는 활동명<input name="name" maxlength="40" required></label>
      <label class="pf-l">악기 / 전공<input name="inst" maxlength="40" required></label>
      <label class="pf-l">활동 지역<select name="region" required></select></label>
      <label class="pf-l">한 줄 소개<input name="intro" maxlength="100" required></label>
      <label class="pf-l">경력 요약<textarea name="career" maxlength="500" rows="4"></textarea></label>
      <label class="pf-l">공개 연락 수단<input name="contact" maxlength="200" required></label>
      <p style="font-size:0.85rem;color:#6b6154">고치면 운영자 확인을 다시 거칩니다.</p>
      <button type="submit" class="btn-primary">수정 저장</button>
    </form>
    <hr style="margin:28px 0;border:0;border-top:1px solid #e5ded2">
    <h3 style="font-size:1rem;margin-bottom:6px">프로필 지우기</h3>
    <p style="font-size:0.88rem;color:#6b6154;line-height:1.7">
      누르는 즉시 지워지며 되돌릴 수 없습니다. 저희 쪽에도 사본이 남지 않습니다.</p>
    <button id="pm-del" type="button"
            style="margin-top:8px;background:#8c2f2f;color:#fff;border:0;border-radius:6px;padding:10px 18px;cursor:pointer">
      지우기</button>
  </div>
</main>
