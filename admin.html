<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 검색엔진에 노출하지 않는다. 열쇠로 막혀 있지만 목록에 뜰 이유가 없다. -->
<meta name="robots" content="noindex, nofollow">
<title>피드백 수신함 — 포디엄</title>
<link rel="stylesheet" href="css/style.css?v=16">
<style>
  .adm { max-width: 720px; margin: 0 auto; padding: 28px var(--gutter, 24px) 80px; }
  .adm h1 { font-size: 1.3rem; margin: 0 0 18px; }
  .adm .key-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .adm input[type=password] { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 10px;
    border: 1px solid rgba(128,128,128,.45); background: transparent; color: inherit; font: inherit; }
  .adm button { padding: 9px 16px; border-radius: 999px; border: 1px solid rgba(128,128,128,.45);
    background: transparent; color: inherit; font: inherit; cursor: pointer; }
  .adm .empty { text-align: center; opacity: .6; padding: 60px 0; line-height: 1.7; }
  .fb-item { border: 1px solid rgba(128,128,128,.3); border-radius: 12px; padding: 14px 16px;
    margin-bottom: 12px; }
  .fb-item.unread { border-left: 3px solid var(--claret, #7a1f2b); }
  .fb-item .meta { font-size: .78rem; opacity: .6; display: flex; gap: 10px; flex-wrap: wrap;
    margin-bottom: 8px; }
  .fb-item .body { white-space: pre-wrap; line-height: 1.6; word-break: break-word; }
  .fb-item .act { margin-top: 10px; }
  .fb-item .act button { font-size: .8rem; padding: 5px 12px; }
</style>

<div class="adm">
  <h1>피드백 수신함</h1>

  <div class="key-row">
    <input type="password" id="key" placeholder="관리자 열쇠" autocomplete="current-password">
    <button id="load">열기</button>
    <button id="diag" title="텔레그램 알림 경로 점검">알림 점검</button>
  </div>
  <div id="diagout" style="font-size:.85rem;opacity:.75;margin:-8px 0 16px"></div>

  <div id="out"><div class="empty">열쇠를 넣고 <b>열기</b>를 누르세요.</div></div>

  <h1 style="margin-top:36px">프로필 승인</h1>
  <p style="font-size:.85rem;opacity:.75;margin:-6px 0 12px">
    자동 게시는 하지 않습니다. 확인 후 <b>공개</b>를 눌러야 디렉토리에 실립니다.</p>
  <div class="key-row" style="margin-bottom:10px">
    <button id="pf-load">대기 목록</button>
    <button id="pf-load-all">전체</button>
  </div>
  <div id="pf-out"><div class="empty">열쇠를 넣고 <b>대기 목록</b>을 누르세요.</div></div>

  <h1 style="margin-top:36px">연락 요청</h1>
  <p style="font-size:.85rem;opacity:.75;margin:-6px 0 12px">
    구인하는 곳이 프로필에 보낸 요청입니다. 확인 후 양쪽을 이어 주고 <b>처리함</b>을 누르세요.</p>
  <div class="key-row" style="margin-bottom:10px"><button id="ct-load">요청 목록</button></div>
  <div id="ct-out"><div class="empty">열쇠를 넣고 <b>요청 목록</b>을 누르세요.</div></div>
</div>

<script>
// 배포 후 workers.dev 주소로 바꾼다 (feedback/README.md 참고).
const API = "https://podium-feedback.ohmjin314.workers.dev";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

// 열쇠는 이 브라우저에만 남는다 — 사이트 소스에는 들어가지 않는다.
$("#key").value = localStorage.getItem("podium_admin_key") || "";

// 열쇠는 헤더로 보낸다. 주소창에 실으면 브라우저 기록과 중간 로그에 그대로 남는다.
const hdr = () => ({ "X-Admin-Key": $("#key").value.trim() });

function fmt(at) {
  try {
    const d = new Date(at);
    return `${d.getMonth() + 1}.${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  } catch { return at; }
}

function render(items) {
  const out = $("#out");
  if (!items.length) {
    out.innerHTML = '<div class="empty">아직 받은 메시지가 없습니다.</div>';
    return;
  }
  const unread = items.filter(i => !i.read).length;
  out.innerHTML =
    `<div class="meta" style="margin-bottom:14px;opacity:.7;font-size:.85rem">전체 ${items.length}건 · 안 읽음 ${unread}건</div>` +
    items.map(i => `
      <div class="fb-item ${i.read ? "" : "unread"}">
        <div class="meta"><span>${fmt(i.at)}</span><span>${esc(i.page || "")}</span>
          ${i.tg && i.tg !== "ok" ? `<span style="color:#b00">알림 ${esc(i.tg)}</span>` : ""}</div>
        <div class="body">${esc(i.message)}</div>
        <div class="act"><button data-k="${esc(i._key)}" data-read="${i.read ? 1 : 0}">
          ${i.read ? "안 읽음으로" : "읽음 처리"}</button></div>
      </div>`).join("");

  out.querySelectorAll(".act button").forEach(b => b.addEventListener("click", async () => {
    const path = b.dataset.read === "1" ? "unread" : "read";
    b.disabled = true;
    await fetch(`${API}/api/${path}?k=${encodeURIComponent(b.dataset.k)}`,
                { method: "POST", headers: hdr() });
    load();
  }));
}

async function load() {
  const key = $("#key").value.trim();
  if (!key) return;
  localStorage.setItem("podium_admin_key", key);
  $("#out").innerHTML = '<div class="empty">불러오는 중…</div>';
  try {
    const r = await fetch(`${API}/api/list`, { headers: hdr() });
    const d = await r.json();
    if (!d.ok) { $("#out").innerHTML = `<div class="empty">${esc(d.error || "열지 못했습니다")}</div>`; return; }
    render(d.items || []);
  } catch {
    $("#out").innerHTML = '<div class="empty">서버에 닿지 못했습니다.</div>';
  }
}

// 알림이 안 올 때 어디가 막혔는지 보기 위한 점검 — 봇이 누구인지, 보내기가 되는지.
$("#diag").addEventListener("click", async () => {
  const o = $("#diagout");
  if (!$("#key").value.trim()) { o.textContent = "열쇠를 먼저 넣어 주세요."; return; }
  o.textContent = "점검 중…";
  try {
    const d = await (await fetch(`${API}/api/diag`, { headers: hdr() })).json();
    if (!d.ok) { o.textContent = d.error || "점검 실패"; return; }
    o.textContent = `봇 ${d.bot || "?"} · 토큰 ${d.hasToken ? "있음" : "없음"}`
      + ` · 대화방 ${d.hasChatId ? "있음" : "없음"} · 발송 ${d.send}`;
  } catch { o.textContent = "서버에 닿지 못했습니다."; }
});

// --- 프로필 승인 (작업 H-2) ---
// 자동 게시 금지가 이 화면의 존재 이유다. 반려는 지우지 않고 표시만 바꾼다 —
// 본인이 확인 코드로 지울 수 있어야 하고, 실수로 지웠을 때 되돌릴 방법이 없으면 곤란하다.
const PF_LABEL = { pending: "대기", published: "공개 중", rejected: "보류" };

function pfRender(items) {
  const box = $("#pf-out");
  if (!items.length) { box.innerHTML = '<div class="empty">해당하는 프로필이 없습니다.</div>'; return; }
  box.innerHTML = items.map(p => `
    <div class="item" data-id="${esc(p.id)}">
      <div style="font-size:.8rem;opacity:.7">
        ${esc(p.at || "").slice(0, 16).replace("T", " ")} · ${esc(PF_LABEL[p.status] || p.status)}
        ${p.editedAt ? " · 수정됨" : ""}
      </div>
      <div style="margin:4px 0"><b>${esc(p.name)}</b> · ${esc(p.inst)} · ${esc(p.region)}</div>
      <div style="font-size:.9rem">${esc(p.intro)}</div>
      ${p.career ? `<div style="font-size:.85rem;opacity:.8;margin-top:4px">${esc(p.career)}</div>` : ""}
      <div style="font-size:.85rem;margin-top:4px">연락: ${esc(p.contact)}</div>
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
        <button data-act="published">공개</button>
        <button data-act="rejected">보류</button>
        <button data-act="delete" style="color:#8c2f2f">삭제</button>
      </div>
    </div>`).join("");
}

async function pfLoad(status) {
  const box = $("#pf-out");
  if (!$("#key").value.trim()) { box.innerHTML = '<div class="empty">열쇠를 먼저 넣어 주세요.</div>'; return; }
  box.innerHTML = '<div class="empty">불러오는 중…</div>';
  try {
    const q = status ? `?status=${status}` : "";
    const d = await (await fetch(`${API}/api/profile/admin${q}`, { headers: hdr() })).json();
    if (!d.ok) { box.innerHTML = `<div class="empty">${esc(d.error || "실패")}</div>`; return; }
    pfRender(d.items || []);
  } catch { box.innerHTML = '<div class="empty">서버에 닿지 못했습니다.</div>'; }
}

$("#pf-out").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const id = btn.closest(".item").getAttribute("data-id");
  const act = btn.getAttribute("data-act");
  if (act === "delete" && !confirm("이 프로필을 지울까요? 되돌릴 수 없습니다.")) return;
  btn.disabled = true;
  const url = act === "delete" ? "/api/profile/admin/delete" : "/api/profile/admin";
  const body = act === "delete" ? { id } : { id, status: act };
  try {
    const d = await (await fetch(API + url, {
      method: "POST",
      headers: { ...hdr(), "Content-Type": "application/json" },
      body: JSON.stringify(body),
    })).json();
    if (!d.ok) { alert(d.error || "실패"); btn.disabled = false; return; }
    btn.closest(".item").remove();
  } catch { alert("서버에 닿지 못했습니다."); btn.disabled = false; }
});

// --- 연락 요청 수신함 (중개, 2026-08-20) ---
async function ctLoad() {
  const box = $("#ct-out");
  if (!$("#key").value.trim()) { box.innerHTML = '<div class="empty">열쇠를 먼저 넣어 주세요.</div>'; return; }
  box.innerHTML = '<div class="empty">불러오는 중…</div>';
  try {
    const d = await (await fetch(`${API}/api/contacts`, { headers: hdr() })).json();
    if (!d.ok) { box.innerHTML = `<div class="empty">${esc(d.error || "실패")}</div>`; return; }
    const items = d.items || [];
    if (!items.length) { box.innerHTML = '<div class="empty">받은 요청이 없습니다.</div>'; return; }
    box.innerHTML = items.map(c => `
      <div class="item" data-key="${esc(c.key)}" style="${c.handled ? "opacity:.55" : ""}">
        <div style="font-size:.8rem;opacity:.7">
          ${esc(c.at || "").slice(0, 16).replace("T", " ")} · → <b>${esc(c.toName)}</b>
          ${c.handled ? " · 처리됨" : ""}
        </div>
        <div style="margin:4px 0;font-size:.9rem">${esc(c.org ? c.org + " · " : "")}${esc(c.from)}</div>
        <div style="font-size:.9rem;white-space:pre-wrap">${esc(c.message)}</div>
        ${c.handled ? "" : '<div style="margin-top:8px"><button data-act="done">처리함</button></div>'}
      </div>`).join("");
  } catch { box.innerHTML = '<div class="empty">서버에 닿지 못했습니다.</div>'; }
}

$("#ct-out").addEventListener("click", async (e) => {
  const btn = e.target.closest('button[data-act="done"]');
  if (!btn) return;
  btn.disabled = true;
  const key = btn.closest(".item").getAttribute("data-key");
  try {
    const d = await (await fetch(`${API}/api/contacts/done`, {
      method: "POST", headers: { ...hdr(), "Content-Type": "application/json" },
      body: JSON.stringify({ key }),
    })).json();
    if (!d.ok) { alert(d.error || "실패"); btn.disabled = false; return; }
    ctLoad();
  } catch { alert("서버에 닿지 못했습니다."); btn.disabled = false; }
});

$("#ct-load").addEventListener("click", ctLoad);

$("#pf-load").addEventListener("click", () => pfLoad("pending"));
$("#pf-load-all").addEventListener("click", () => pfLoad(""));

$("#load").addEventListener("click", load);
$("#key").addEventListener("keydown", e => { if (e.key === "Enter") load(); });
</script>
