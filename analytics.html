<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 검색엔진에 노출하지 않는다 (robots.txt 에도 Disallow). admin.html 과 같은 취급. -->
<meta name="robots" content="noindex, nofollow">
<title>방문 대시보드 — 포디엄</title>
<!--
  ── 왜 데이터가 이 저장소에 없는가 ─────────────────────────────────────────
  이 저장소는 public 이라 data/traffic.json 을 커밋하면 방문자 수·검색 유입·어떤 공고가
  읽히는지가 통째로 공개된다(.gitignore 가 그래서 막고 있다). 그렇다고 로컬 서버를
  띄워야만 보이면 실제로는 안 보게 된다 — 그래서 **화면만 공개하고 데이터는 열쇠로** 받는다:

    PC (매일 18시 run_daily)
      crawler/traffic.py  → data/traffic.json   (GA4: 들어온 뒤)
      crawler/gsc.py      → data/search.json    (Search Console: 들어오기 전)
      crawler/dash_upload.py → Worker KV 에 합본 업로드
    브라우저 (이 페이지)
      열쇠를 넣고 GET /api/dash → 그 합본을 받아 그린다. 열쇠는 이 기기에만 저장된다.

  열쇠는 피드백 수신함(admin.html)과 같은 ADMIN_KEY 다.
  로컬에서 정적 서버로 열면 열쇠 없이 data/*.json 을 직접 읽는다(개발용 경로).

  ── 이 화면의 기준 하나 ──────────────────────────────────────────────────
  헤드라인 숫자는 전부 **참여 세션(engagedSessions)** 이다. 봇을 이름으로 걸러내는 대신
  GA4 자신의 정의(10초 이상 머물렀거나 2페이지 이상 봤거나 전환)를 쓴다. 헬스체크도
  데이터센터 스캐너도 참여 세션이 0이라 저절로 빠지고, 새 봇이 와도 규칙을 고칠 필요가 없다.
  '전체 세션'은 회색으로 같이 보여준다 — 둘의 격차가 곧 봇의 크기다.
-->
<style>
  :root{
    --ivory:#fbfaf7; --paper:#fff; --wash:#f2efe7; --ink:#1b1917; --ink-soft:#736c60;
    --line:#e4ded1; --claret:#7a2a38; --claret-tint:#f2e5e6; --green:#35674a;
    --green-tint:#e6efe8; --grey:#9a958a; --radius:3px;
    --serif:"Gowun Batang","Nanum Myeongjo","Batang",serif;
    --sans:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:26px 20px 90px}
  h1{font-family:var(--serif);font-size:1.5rem;margin:0 0 2px;font-weight:600}
  h2{font-family:var(--serif);font-size:1.05rem;margin:34px 0 10px;font-weight:600;
     padding-bottom:6px;border-bottom:1px solid var(--line)}
  h2 .sub{font-family:var(--sans);font-size:.76rem;font-weight:400;color:var(--ink-soft);
          margin-left:8px}
  .lede{color:var(--ink-soft);font-size:.84rem;margin:0 0 18px}

  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 22px}
  .bar button{font:inherit;font-size:.83rem;padding:5px 13px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink-soft);border-radius:999px;cursor:pointer}
  .bar button.on{background:var(--claret);border-color:var(--claret);color:#fff}
  .bar .spacer{flex:1}
  .bar label{font-size:.8rem;color:var(--ink-soft);display:flex;align-items:center;gap:6px;
    cursor:pointer}

  .gate{max-width:420px;margin:60px auto;background:var(--paper);border:1px solid var(--line);
    border-radius:var(--radius);padding:22px 24px}
  .gate h2{margin-top:0;border:0;padding:0}
  .gate p{font-size:.85rem;color:var(--ink-soft);margin:0 0 16px}
  .gate .row{display:flex;gap:8px}
  .gate input{flex:1;min-width:0;padding:9px 12px;border-radius:var(--radius);
    border:1px solid var(--line);background:transparent;color:inherit;font:inherit}
  .gate button{padding:9px 18px;border-radius:999px;border:1px solid var(--claret);
    background:var(--claret);color:#fff;font:inherit;cursor:pointer}
  .gate .msg{font-size:.82rem;color:var(--claret);margin-top:12px;min-height:1.2em}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px}
  .kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 15px}
  .kpi .k{font-size:.75rem;color:var(--ink-soft);margin-bottom:3px}
  .kpi .v{font-family:var(--serif);font-size:1.7rem;line-height:1.1;letter-spacing:-.01em}
  .kpi .n{font-size:.73rem;color:var(--grey);margin-top:4px}
  .kpi.accent .v{color:var(--claret)}

  table{width:100%;border-collapse:collapse;font-size:.85rem;background:var(--paper);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  th{text-align:left;font-weight:600;font-size:.75rem;color:var(--ink-soft);
     padding:8px 11px;border-bottom:1px solid var(--line);background:var(--wash)}
  td{padding:7px 11px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  td.t{max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  tr.bot td{color:var(--grey)}
  .tag{display:inline-block;font-size:.68rem;padding:1px 6px;border-radius:999px;
    border:1px solid var(--line);background:var(--wash);color:var(--ink-soft);white-space:nowrap}
  .tag.bot{background:#f4f2ee}
  .tag.ret{background:var(--green-tint);border-color:#cfe0d4;color:var(--green)}
  .scroll{overflow-x:auto}
  table.hourgrid td,table.hourgrid th{padding:4px 5px;font-size:.76rem}
  th.hg{color:var(--grey);font-weight:400}
  th.hg.night{color:var(--green)}
  td.hg{color:var(--grey)}
  td.hg.off{background:var(--wash)}
  td.hg.on{background:var(--claret);color:#fff;font-weight:600}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid2 > *{min-width:0}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  .grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .grid4 > *{min-width:0}
  .note{font-size:.78rem;color:var(--ink-soft);margin:10px 0 0}

  /* 섹션 카드 — 표가 쭉 이어지지 않게 한 덩어리씩 묶는다 */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:6px;
    padding:16px 18px 14px;margin-top:16px;min-width:0}
  .grid2 > .card{margin-top:0}
  .grid2.cards{margin-top:16px}
  /* 카드 두 장을 나란히 두기엔 좁으면 출처 이름이 말줄임으로 뭉개진다 — 일찍 한 줄로 */
  @media(max-width:960px){.grid2.cards{grid-template-columns:1fr}}
  .card h2{margin:0 0 12px;padding:0;border:0;display:flex;align-items:baseline;
    flex-wrap:wrap;gap:2px 8px}
  .card h2 .sub{margin-left:0}
  .card h3{font-size:.78rem;font-weight:600;color:var(--ink-soft);margin:0 0 6px}
  .card .kpis{margin-bottom:14px}
  .card .kpi{background:var(--ivory)}
  .card table{border-color:var(--line)}
  .card table tbody tr:hover td{background:#faf8f3}
  .card table.hourgrid tbody tr:hover td{background:inherit}
  .card table.hourgrid tbody tr:hover td.hg.on{background:var(--claret)}
  .card table.hourgrid tbody tr:hover td.hg.off{background:var(--wash)}
  .mini{background:var(--ivory);border:1px solid var(--line);border-radius:4px;padding:10px}
  .mini table{font-size:.8rem}
  .mini td,.mini th{padding:5px 8px}

  /* 표 페이지 넘김 */
  .pager{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:8px;
    font-size:.75rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .pager .cnt{margin-right:auto;color:var(--grey)}
  .pager button{font:inherit;width:28px;height:26px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink);border-radius:4px;cursor:pointer;line-height:1}
  .pager button:hover:not(:disabled){border-color:var(--claret);color:var(--claret)}
  .pager button:disabled{color:var(--line);cursor:default}
  .pager .pg{min-width:44px;text-align:center}
  .bar{position:sticky;top:0;z-index:5;background:var(--ivory);padding:8px 0;
    border-bottom:1px solid var(--line)}
  .empty{color:var(--grey);font-size:.85rem;padding:14px 0}
  code{background:var(--wash);padding:1px 5px;border-radius:2px;font-size:.85em}
</style>

<div class="wrap">
  <h1>방문 대시보드</h1>
  <p class="lede">podiumclassical.kr · <span id="meta">불러오는 중…</span></p>

  <div id="gate" class="gate" hidden>
    <h2>관리자 열쇠</h2>
    <p>방문 통계는 공개되지 않습니다. 피드백 수신함과 같은 열쇠를 넣으세요 —
       이 기기에만 저장되며 다음부터는 바로 열립니다.</p>
    <div class="row">
      <input type="password" id="key" placeholder="관리자 열쇠" autocomplete="current-password">
      <button id="enter">열기</button>
    </div>
    <div class="msg" id="gatemsg"></div>
  </div>

  <div id="controls" hidden>
    <div class="bar">
      <button data-days="7">최근 7일</button>
      <button data-days="14" class="on">최근 14일</button>
      <button data-days="0">전체</button>
      <span class="spacer"></span>
      <label><input type="checkbox" id="showbots"> 봇·자동접속도 표시</label>
    </div>
  </div>

  <div id="app"></div>
</div>

<script>
// ── 데이터 확보 ────────────────────────────────────────────────────────────
var API = "https://podium-feedback.ohmjin314.workers.dev/api/dash";
var KEYNAME = "podium_dash_key";
var DAYS = null, SEARCH = null, JOBS = {}, RANGE = 14, RANGES = null;

function getKey() { try { return localStorage.getItem(KEYNAME) || ""; } catch (e) { return ""; } }
function setKey(k) { try { localStorage.setItem(KEYNAME, k); } catch (e) {} }

function loadJSON(url, opt) {
  return fetch(url, opt).then(function (r) {
    if (!r.ok) { var e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
    return r.json();
  });
}

// 공고 제목은 공개 데이터라 사이트에서 그냥 읽는다 (열쇠와 무관).
function loadJobs() {
  return Promise.all([
    loadJSON("data/official.json").catch(function () { return null; }),
    loadJSON("data/archive.json").catch(function () { return null; })
  ]).then(function (r) {
    if (r[0]) (r[0].items || []).forEach(function (j) { JOBS[j.id] = j; });
    if (r[1]) Object.keys(r[1].items || {}).forEach(function (k) {
      if (!JOBS[k]) JOBS[k] = r[1].items[k];
    });
  });
}

// 로컬(정적 서버)에서는 열쇠 없이 data/*.json 을 바로 읽는다 — 개발용 경로.
function loadLocal() {
  // no-store 가 없으면 브라우저가 옛 traffic.json 을 계속 물고 있는다 — 수집기를 돌려도
  // 화면이 안 바뀌어서 코드를 의심하게 된다(2026-08-19에 실제로 그랬다).
  // 배포 경로(Worker)는 동적 응답이라 해당 없음.
  var fresh = { cache: "no-store" };
  return Promise.all([
    loadJSON("data/traffic.json", fresh),
    loadJSON("data/search.json", fresh).catch(function () { return null; })
  ]).then(function (r) { return { traffic: r[0], search: r[1] }; });
}

function loadRemote(key) {
  return loadJSON(API, { headers: { "X-Admin-Key": key } });
}

function apply(doc) {
  DAYS = (doc.traffic || {}).days || {};
  RANGES = (doc.traffic || {}).ranges || null;
  SEARCH = doc.search || null;
  var ks = Object.keys(DAYS).sort();
  var up = (doc.traffic || {}).updatedAt;
  document.getElementById("meta").textContent =
    ks.length ? (ks[0] + " ~ " + ks[ks.length - 1] + " · " + ks.length + "일치"
                 + (up ? " · 갱신 " + up : "")) : "데이터 없음";
  document.getElementById("gate").hidden = true;
  document.getElementById("controls").hidden = false;
  render();
}

function showGate(msg) {
  document.getElementById("gate").hidden = false;
  document.getElementById("controls").hidden = true;
  document.getElementById("meta").textContent = "열쇠 필요";
  document.getElementById("gatemsg").textContent = msg || "";
}

function boot() {
  loadJobs();
  var isLocal = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  var key = getKey();
  // 열쇠를 넣은 적이 없는 첫 방문에 '열쇠가 맞지 않습니다'가 뜨면 틀린 안내다.
  // 아래 catch 가 이 표시로 '시도했다 vs 아직 없다'를 구분한다.
  var first = key ? loadRemote(key)
                  : (isLocal ? loadLocal() : Promise.reject({ status: 0, virgin: true }));
  first.then(apply).catch(function (e) {
    // 열쇠가 틀렸거나 없다 → 로컬이면 파일 경로로 한 번 더 시도해 본다
    if (isLocal) {
      loadLocal().then(apply).catch(function () {
        showGate(e.status === 401 ? "저장된 열쇠가 맞지 않습니다 — 다시 넣어 주세요." : "");
      });
      return;
    }
    showGate(e.virgin ? ""
             : e.status === 401 ? "저장된 열쇠가 맞지 않습니다 — 다시 넣어 주세요."
             : e.status === 404 ? "아직 올라온 데이터가 없습니다 (PC에서 dash_upload.py 실행)."
             : "연결 실패 — " + (e.message || ""));
  });
}

document.getElementById("enter").onclick = function () {
  var k = document.getElementById("key").value.trim();
  if (!k) return;
  document.getElementById("gatemsg").textContent = "확인 중…";
  loadRemote(k).then(function (doc) { setKey(k); apply(doc); }).catch(function (e) {
    showGate(e.status === 401 ? "열쇠가 맞지 않습니다."
             : e.status === 404 ? "열쇠는 맞지만 아직 올라온 데이터가 없습니다."
             : "연결 실패 — " + e.message);
  });
};
document.getElementById("key").addEventListener("keydown", function (e) {
  if (e.key === "Enter") document.getElementById("enter").click();
});

document.querySelectorAll(".bar button").forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll(".bar button").forEach(function (x) { x.classList.remove("on"); });
    b.classList.add("on");
    RANGE = +b.dataset.days;
    PAGES = {};
    render();
  };
});
document.getElementById("showbots").onchange = render;
boot();

// ── 유틸 ──────────────────────────────────────────────────────────────────
// 경로만 보면 / 와 /index.html 이 같은 화면이라는 걸 알 수 없다. 이름을 붙여 준다.
var PAGE_NAMES = {
  "/": "홈", "/index.html": "홈", "/jobs.html": "구인구직 목록",
  "/practice.html": "연습실", "/about.html": "소개", "/sources.html": "수집 출처",
  "/privacy.html": "개인정보", "/analytics.html": "이 대시보드"
};
function pageLabel(path) {
  var p = String(path || "").replace(/^https?:\/\/[^/]+/, "").split("?")[0];
  if (PAGE_NAMES[p]) return p + "  <span class=\"tag\">" + PAGE_NAMES[p] + "</span>";
  if (/^\/p\//.test(p)) return p + '  <span class="tag">공고 상세</span>';
  return esc(p);
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}
function n(x) { return (x || 0).toLocaleString("ko-KR"); }
function pct(a, b) { return b ? Math.round(a / b * 100) + "%" : "—"; }
function dur(sec) {
  sec = Math.round(sec || 0);
  if (sec < 60) return sec + "초";
  var m = Math.floor(sec / 60);
  return m < 60 ? m + "분" : Math.floor(m / 60) + "시간 " + (m % 60) + "분";
}
function keys() {
  var ks = Object.keys(DAYS).sort();
  return RANGE ? ks.slice(-RANGE) : ks;
}
function addInto(map, obj) {
  Object.keys(obj || {}).forEach(function (k) { map[k] = (map[k] || 0) + obj[k]; });
}
function sorted(map, limit) {
  var a = Object.keys(map).map(function (k) { return [k, map[k]]; });
  a.sort(function (x, y) { return y[1] - x[1]; });
  return limit ? a.slice(0, limit) : a;
}
// 표는 전부 쪽 단위로 끊는다 — 줄이 많아 화면이 세로로 끝없이 늘어나는 걸 막는다.
// 줄은 다 그려 두고 setupPagers()가 보이는 쪽만 남긴다. 쪽 번호는 PAGES 에 표 id 별로
// 들고 있어서 봇 표시 체크처럼 다시 그려도 보던 쪽에 그대로 머문다.
var PAGES = {};
function paged(id, per, cls, head, rows) {
  return '<div class="pt" data-id="' + id + '" data-per="' + (per || 8) + '">' +
    '<div class="scroll"><table' + (cls ? ' class="' + cls + '"' : "") + "><thead>" + head +
    "</thead><tbody>" + rows.join("") + "</tbody></table></div></div>";
}
function table(head, rows, empty, id, per) {
  if (!rows.length) return '<div class="empty">' + (empty || "기록 없음") + "</div>";
  var h = head.map(function (c) {
    return '<th' + (c[1] ? ' class="num"' : "") + ">" + esc(c[0]) + "</th>";
  }).join("");
  return paged(id, per, "", "<tr>" + h + "</tr>", rows);
}
function setupPagers() {
  REFIT = [];
  document.querySelectorAll("#app .pt").forEach(function (box) {
    var id = box.dataset.id, per = +box.dataset.per;
    var trs = box.querySelectorAll("tbody > tr"), total = trs.length;
    var pages = Math.ceil(total / per);
    if (pages <= 1) return;
    var bar = document.createElement("div");
    bar.className = "pager";
    bar.innerHTML = '<span class="cnt"></span><button type="button" aria-label="이전 쪽">‹</button>' +
      '<span class="pg"></span><button type="button" aria-label="다음 쪽">›</button>';
    box.appendChild(bar);
    var cnt = bar.querySelector(".cnt"), pg = bar.querySelector(".pg"),
        btn = bar.querySelectorAll("button"), sc = box.querySelector(".scroll");
    function show(p) {
      p = Math.max(0, Math.min(pages - 1, p));
      PAGES[id] = p;
      for (var i = 0; i < total; i++) trs[i].hidden = (i < p * per || i >= (p + 1) * per);
      cnt.textContent = (p * per + 1) + "–" + Math.min(total, (p + 1) * per) + " · 총 " + n(total);
      pg.textContent = (p + 1) + " / " + pages;
      btn[0].disabled = p === 0;
      btn[1].disabled = p === pages - 1;
    }
    // 마지막 쪽이 짧아도 넘김 단추가 위로 튀지 않게 첫 쪽 높이를 바닥으로 깐다.
    // 폭이 바뀌면 줄바꿈이 달라져 높이도 달라지므로 창 크기가 바뀔 때마다 다시 잰다.
    function fit() {
      var cur = PAGES[id] || 0;
      sc.style.minHeight = "";
      show(0);
      sc.style.minHeight = sc.offsetHeight + "px";
      show(cur);
    }
    fit();
    REFIT.push(fit);
    btn[0].onclick = function () { show(PAGES[id] - 1); };
    btn[1].onclick = function () { show(PAGES[id] + 1); };
  });
}
var REFIT = [], refitTimer = 0;
window.addEventListener("resize", function () {
  clearTimeout(refitTimer);
  refitTimer = setTimeout(function () { REFIT.forEach(function (f) { f(); }); }, 120);
});
function card(title, sub, body, cls) {
  return '<section class="card' + (cls ? " " + cls : "") + '"><h2>' + title +
    (sub ? ' <span class="sub">' + sub + "</span>" : "") + "</h2>" + body + "</section>";
}
function kpis(list) {
  return '<div class="kpis">' + list.map(function (c) {
    return '<div class="kpi' + (c[3] ? " accent" : "") + '"><div class="k">' + c[0] +
      '</div><div class="v">' + c[1] + '</div><div class="n">' + esc(c[2]) + "</div></div>";
  }).join("") + "</div>";
}
// 막대 차트 — 배경(연한)=전체, 앞(진한)=참여. 의존성 없이 SVG 로 직접 그린다.
function bars(items, opt) {
  opt = opt || {};
  var W = 1000, H = opt.h || 120, pad = 18, max = 1;
  items.forEach(function (it) { max = Math.max(max, it.bg || 0, it.fg || 0); });
  var bw = (W - pad * 2) / items.length;
  var s = '<svg viewBox="0 0 ' + W + " " + (H + 26) + '" style="width:100%;height:auto" ' +
          'preserveAspectRatio="none" role="img">';
  items.forEach(function (it, i) {
    var x = pad + i * bw, w = Math.max(2, bw * 0.66), ox = x + (bw - w) / 2;
    var hb = (it.bg || 0) / max * H, hf = (it.fg || 0) / max * H;
    s += '<rect x="' + ox + '" y="' + (H - hb) + '" width="' + w + '" height="' + hb +
         '" fill="#e4ded1"/>';
    s += '<rect x="' + ox + '" y="' + (H - hf) + '" width="' + w + '" height="' + hf +
         '" fill="#7a2a38"/>';
    if (it.label) s += '<text x="' + (ox + w / 2) + '" y="' + (H + 17) +
      '" text-anchor="middle" font-size="' + (opt.fs || 15) + '" fill="#9a958a" ' +
      'font-family="sans-serif">' + esc(it.label) + "</text>";
  });
  return s + "</svg>";
}

// 참조 URL 을 사람이 읽는 한 줄로. 여기 정보가 생각보다 깊다 —
// 네이버 블로그 referrer 에는 어느 글(logNo)인지에 더해, 그 사람이 블로그에 닿기까지
// 쓴 검색어(topReferer 안의 query)까지 실려 온다. 그게 우리 유입의 원류다.
function refLabel(u) {
  var out = { where: u, detail: "" };
  try {
    var url = new URL(u);
    var host = url.hostname.replace(/^www\./, "");
    if (host === "podiumclassical.kr") { out.where = "사이트 내부 이동"; out.detail = url.pathname; return out; }
    if (host.indexOf("blog.naver.com") >= 0) {
      var logNo = url.searchParams.get("logNo");
      out.where = "네이버 블로그" + (logNo ? " · 글 " + logNo : "");
      var top = url.searchParams.get("topReferer");
      if (top) {
        try {
          var t = new URL(top), q = t.searchParams.get("query") || t.searchParams.get("q");
          out.detail = q ? "검색어 “" + q + "”  (" + t.hostname.replace(/^www\./, "") + ")"
                         : t.hostname.replace(/^www\./, "") + " 경유";
        } catch (e) { out.detail = "경유 " + top.slice(0, 40); }
      }
      return out;
    }
    if (/google\./.test(host)) { out.where = "구글 검색"; return out; }
    if (/naver\.com/.test(host)) { out.where = "네이버 검색"; return out; }
    if (/bing\./.test(host)) { out.where = "빙 검색"; return out; }
    if (/chatgpt|openai/.test(host)) { out.where = "ChatGPT"; return out; }
    out.where = host; out.detail = url.pathname.slice(0, 40);
  } catch (e) { /* 파싱 실패하면 원문 그대로 */ }
  return out;
}

// 날짜 x 시각 표 — 셀 하나가 "그날 그 시각의 세션 수".
// 값이 0인 칸은 비워 둔다. 24열이 가로로 넘치면 표만 가로 스크롤된다.
function hourGrid(a) {
  var days = keys().slice().reverse();
  if (!days.length) return '<div class="empty">기록 없음</div>';
  var head = '<tr><th>날짜</th>';
  // 날짜가 쌓이면 이 표가 제일 길어진다 — 한 쪽에 일주일씩.
  for (var h = 0; h < 24; h++) {
    var night = (h >= 22 || h <= 5);
    head += '<th class="num hg' + (night ? " night" : "") + '">' + h + "</th>";
  }
  head += '<th class="num">합</th></tr>';
  var body = days.map(function (d) {
    var r = DAYS[d] || {}, hrs = r.hours || {}, tot = 0, cells = "";
    for (var h = 0; h < 24; h++) {
      var v = hrs[String(h)] || hrs[("0" + h).slice(-2)] || [0, 0];
      if (typeof v === "number") v = [v, 0];
      tot += v[0];
      cells += '<td class="num hg' + (v[1] > 0 ? " on" : v[0] > 0 ? " off" : "") + '">' +
        (v[0] || "") + "</td>";
    }
    var dt = new Date(d + "T00:00:00");
    var wd = ["일", "월", "화", "수", "목", "금", "토"][dt.getDay()];
    return '<tr><td style="white-space:nowrap">' + esc(d.slice(5).replace("-", "/")) +
      " (" + wd + ")</td>" + cells + '<td class="num">' + n(tot) + "</td></tr>";
  });
  return paged("hours", 7, "hourgrid", head, body);
}

// ── 집계 ──────────────────────────────────────────────────────────────────
// '지휘|교수'와 '교수|지휘'는 같은 필터다 — 고른 순서까지 다른 조합으로 세면 표가 쪼개진다.
function comboKey(row) {
  return row.slice(0, 5).map(function (x) {
    if (x === "(not set)" || !x) return "";
    return x.split("|").sort().join("|");
  }).join("\u0001");                         // bands|insts|regions|toggles|query
}

// 사용자 수는 날짜별 값을 더하면 '연인원'이 된다 — traffic.py 가 기간 버튼별로 GA4 에
// 따로 물어 둔 값(ranges)을 쓴다. 그 구간의 끝이 지금 데이터의 마지막 날과 다르면
// 다른 기간의 숫자이므로 쓰지 않는다.
function rangeUsers() {
  var R = RANGES && RANGES[RANGE ? String(RANGE) : "all"];
  var ks = Object.keys(DAYS).sort();
  if (!R || R.to !== ks[ks.length - 1]) return null;
  var by = {};
  (R.comboUsers || []).forEach(function (row) {
    // 순서만 다른 조합을 합친 줄은 사람을 겹쳐 셀 수 있다 — 드물고 작아서 그냥 더한다
    var k = comboKey(row);
    by[k] = (by[k] || 0) + row[5];
  });
  return { total: R.filterUsers || 0, by: by };
}

function aggregate() {
  var a = {
    sessions: 0, users: 0, newUsers: 0, engaged: 0, sec: 0, pv: 0,
    events: {}, pages: {}, hours: {}, jobs: {},
    bands: {}, results: {}, finsts: {}, fregions: {},
    kind: {}, tier: {}, inst: {}, jregion: {}, cert: {}, career: {}, dday: {}, dest: {},
    src: {}, aud: {}, daily: [], land: {}, ref: {},
    combos: {},        // 필터 조합 → [결과건수, 횟수]
    visits: []         // 최근 방문: {date, hours:[시각…], engaged}
  };
  keys().forEach(function (d) {
    var r = DAYS[d] || {}, t = r.totals || {};
    a.sessions += t.sessions || 0; a.users += t.users || 0; a.newUsers += t.newUsers || 0;
    a.engaged += t.engaged || 0; a.sec += t.engagementSec || 0; a.pv += t.pv || 0;
    a.daily.push({ date: d, bg: t.sessions || 0, fg: t.engaged || 0, label: d.slice(8) + "일" });
    addInto(a.events, r.events);
    // hours 는 v3부터 [세션, 참여세션]. 옛 형식(숫자)도 견딘다.
    Object.keys(r.hours || {}).forEach(function (h) {
      var v = r.hours[h], se = (typeof v === "number") ? [v, 0] : v;
      var cur = a.hours[h] || (a.hours[h] = [0, 0]);
      cur[0] += se[0]; cur[1] += se[1];
    });
    var vh = Object.keys(r.hours || {}).filter(function (h) {
      var v = r.hours[h]; return (typeof v === "number") ? false : v[1] > 0;
    }).map(Number).sort(function (x, y) { return x - y; });
    if (vh.length) a.visits.push({ date: d, hours: vh, engaged: (r.totals || {}).engaged || 0 });
    addInto(a.jobs, r.jobs);
    Object.keys(r.pages || {}).forEach(function (p) {
      var v = r.pages[p]; a.pages[p] = a.pages[p] || [0, 0];
      a.pages[p][0] += v[0]; a.pages[p][1] += v[1];
    });
    var f = r.filters || {}, jm = r.jobmeta || {};
    addInto(a.bands, f.bands); addInto(a.results, f.results);
    addInto(a.finsts, f.insts); addInto(a.fregions, f.regions);
    addInto(a.kind, jm.kind); addInto(a.dday, jm.dday); addInto(a.dest, jm.dest);
    addInto(a.tier, jm.tier); addInto(a.inst, jm.inst); addInto(a.jregion, jm.region);
    addInto(a.cert, jm.cert); addInto(a.career, jm.career);
    (r.landing || []).forEach(function (row) {
      var k = row[0] + "|" + row[1], v = a.land[k] || (a.land[k] = [0, 0, 0]);
      for (var i = 0; i < 3; i++) v[i] += row[2 + i];
    });
    (r.referrers || []).forEach(function (row) {
      if (!row[0]) return;                       // 참조 없음(직접 입력·북마크)
      var v = a.ref[row[0]] || (a.ref[row[0]] = [0, 0]);
      v[0] += row[1]; v[1] += row[2];
    });
    (r.filterCombos || []).forEach(function (row) {
      // f_results 가 숫자인 행만이 실제 필터 사용이다. page_view 처럼 이 파라미터를 아예
      // 안 싣는 이벤트가 전부 (not set) 한 줄로 뭉쳐 오는데, 그걸 0건으로 읽으면
      // '조건 없음 · 0건 · 130회'라는 없는 빈손이 만들어진다.
      if (!/^\d+$/.test(row[5])) return;
      var k = comboKey(row);
      // 같은 조합도 날마다 결과 수가 다르다(공고가 들고 난다). 마지막 값만 남기면
      // '이 필터는 늘 1건'인지 '그날만 1건'인지 구분이 사라진다 — 범위로 들고 있는다.
      var v = +row[5];
      var c = a.combos[k] || (a.combos[k] = { min: v, max: v, n: 0 });
      if (v < c.min) c.min = v;
      if (v > c.max) c.max = v;
      c.n += row[6];
    });
    (r.sources || []).forEach(function (row) {
      // v4부터 [출처, 매체, 채널그룹, 지표5]. 옛 형식은 채널그룹이 없다.
      var wide = row.length >= 8;
      var k = row[0] + "|" + row[1] + "|" + (wide ? row[2] : "");
      var off = wide ? 3 : 2;
      var v = a.src[k] || (a.src[k] = [0, 0, 0, 0, 0]);
      for (var i = 0; i < 5; i++) v[i] += row[off + i];
    });
    (r.audience || []).forEach(function (row) {
      var k = row.slice(0, 5).join("|"), v = a.aud[k] || (a.aud[k] = [0, 0, 0, 0, 0]);
      for (var i = 0; i < 5; i++) v[i] += row[5 + i];
    });
  });
  return a;
}

  H.push('<div class="grid2 cards">');
  H.push(card("유입 경로", "누가 데려왔나",
    table([["출처", 0], ["참여", 1], ["세션", 1], ["PV", 1], ["체류", 1]], srows, "", "src", 8)));
  H.push(card("어디서 왔나 — 자세히", "실제 참조 URL을 풀어서",
    table([["출처", 0], ["무엇을 거쳐서", 0], ["참여", 1], ["세션", 1]], rrows,
          "참조 URL 데이터 없음", "ref", 8) +
    '<p class="note">사이트 내부 이동은 뺐습니다. 네이버 블로그 유입은 어느 글인지와, ' +
    '그 사람이 블로그에 닿기까지 쓴 검색어까지 실려 옵니다.</p>'));
  H.push("</div>");

  var lrows = Object.keys(a.land).map(function (k) { return [k.split("|"), a.land[k]]; })
    .sort(function (x, y) { return y[1][1] - x[1][1] || y[1][0] - x[1][0]; })
    .filter(function (r) { return r[0][1]; })
    .map(function (r) {
      var v = r[1];
      return '<tr class="' + (v[1] ? "" : "bot") + '"><td class="t">' + esc(r[0][0]) + "</td>" +
        '<td class="t">' + pageLabel(r[0][1]) + "</td>" +
        '<td class="num">' + n(v[1]) + '</td><td class="num">' + n(v[0]) +
        '</td><td class="num">' + n(v[2]) + "</td></tr>";
    });
  H.push(card("첫 화면", "출처별로 어느 페이지에 처음 닿았나",
    table([["출처", 0], ["첫 페이지", 0], ["참여", 1], ["세션", 1], ["PV", 1]], lrows, "", "land", 8)));

  // 날짜 x 시각 표. 기간을 뭉갠 24칸 막대로는 "요즘 언제 오나"를 못 본다 —
  // 알림 발송 시각을 정하려면 최근 며칠의 시각 분포가 그대로 보여야 한다.
  H.push(card("방문 시간대", "날짜 × 시각 · 숫자는 세션 수 · 진한 칸이 사람(참여)",
    hourGrid(a) +
    '<p class="note">진한 칸 = 참여 세션이 있었던 시각(사람). 연한 칸 = 세션은 있었지만 ' +
    '참여 0(봇·자동접속). 밤·새벽(22~5시)은 열 머리를 초록으로 표시했습니다.</p>'));

  var arows = Object.keys(a.aud).map(function (k) { return [k, a.aud[k]]; })
    .sort(function (x, y) { return y[1][2] - x[1][2] || y[1][0] - x[1][0]; })
    .filter(function (r) { return showBots || r[1][2] > 0; })
    .map(function (r) {
      var p = r[0].split("|"), v = r[1], bot = v[2] === 0;
      return '<tr class="' + (bot ? "bot" : "") + '"><td class="t">' + esc(p[0]) + "</td>" +
        '<td class="t">' + esc(p[1]) + " · " + esc(p[3] || p[2]) + "</td>" +
        "<td>" + (p[4] === "returning" ? '<span class="tag ret">재방문</span>' :
                  bot ? '<span class="tag bot">자동</span>' : "") + "</td>" +
        '<td class="num">' + n(v[2]) + '</td><td class="num">' + n(v[0]) + "</td>" +
        '<td class="num">' + n(v[4]) + '</td><td class="num">' + dur(v[3]) + "</td></tr>";
    });
  H.push(card("방문자", "도시 · 기기 · 브라우저",
    table([["도시", 0], ["기기", 0], ["", 0], ["참여", 1], ["세션", 1],
           ["PV", 1], ["체류", 1]], arows, "", "aud", 8) +
    (!showBots && botSess > 0
      ? '<p class="note">참여 0인 자동 접속 ' + n(botSess) +
        '세션은 숨겼습니다 — 위 체크박스로 볼 수 있습니다.</p>' : "")));

  // 사용자 지시(2026-08-19): 궁금한 것은 "결과가 몇 건이었나"가 아니라
  // **무엇을 걸렀나** 자체다. 그래서 조합을 빈도순으로 앞세우고 결과 건수는 곁들인다.
  var crows = Object.keys(a.combos).map(function (k) { return [k.split("\u0001"), a.combos[k], k]; })
    .sort(function (x, y) { return y[1].n - x[1].n || x[1].min - y[1].min; })
    .map(function (r) {
      var p = r[0], c = r[1], cells = [];
      var who = RU ? (RU.by[r[2]] ? n(RU.by[r[2]]) + "명" : "—") : "—";
      cells.push(p[0] ? esc(p[0].replace(/\|/g, " + ")) : "—");   // 직종
      cells.push(p[1] ? esc(p[1].replace(/\|/g, " + ")) : "—");   // 악기
      cells.push(p[2] ? esc(p[2].replace(/\|/g, " + ")) : "—");   // 지역
      var extra = [];
      if (p[3]) extra.push(esc(p[3].replace(/\|/g, " + ")));
      if (p[4]) extra.push('검색 "' + esc(p[4]) + '"');
      cells.push(extra.join(" · ") || "—");
      var span = (c.min === c.max) ? n(c.min) : n(c.min) + "~" + n(c.max);
      return "<tr><td>" + cells.join("</td><td>") + '</td><td class="num">' + n(c.n) + "회</td>" +
        '<td class="num">' + who + "</td>" +
        '<td class="num">' + span + "건" +
        (c.max <= 3 ? ' <span class="tag">거의 빈손</span>' : "") + "</td></tr>";
    });
  H.push(card("무엇을 찾고 있나", "필터 조합 · 많이 쓴 순 · 공급(크롤)과 대조할 유일한 축",
    table([["직종", 0], ["악기", 0], ["지역", 0], ["그 밖", 0], ["쓴 횟수", 1], ["사용자", 1],
           ["나온 결과", 1]],
      crows, "필터 조합 데이터 없음", "combo", 10) +
    '<p class="note"><b>쓴 횟수와 사용자를 같이 보세요</b> — 한 사람이 매일 같은 필터를 걸면 ' +
    '횟수만 커집니다. 사용자는 이 기간 동안 그 조합을 쓴 서로 다른 사람 수입니다' +
    (RU ? "" : ' (이 기간의 사용자 수는 아직 집계 전이라 —로 표시)') + '. ' +
    '한 줄이 실제로 켠 필터 한 벌입니다. 순서만 다른 조합은 합쳤고, ' +
    '같은 조합도 날마다 공고가 들고 나므로 결과는 범위로 적었습니다. ' +
    '결과 3건 이하는 사실상 헛걸음이라 표시해 뒀습니다.</p>'));

  // 사용자 지시: 무엇이 열렸나(제목)보다 **어떤 종류가 열렸나**가 궁금하다.
  // 그래서 '많이 열린 공고' 표를 빼고 성격 축을 늘렸다.
  var CH = [["직종", a.kind], ["직무군", a.tier], ["악기", a.inst], ["지역", a.jregion],
            ["마감 임박도", a.dday], ["교원자격 요건", a.cert], ["경력 요건", a.career],
            ["원문 이동처", a.dest]];
  H.push(card("열린 공고의 성격", "방문자가 실제로 펼쳐 본 공고들의 속성 분포",
    '<div class="grid4">' + CH.map(function (c, i) {
      var rows = sorted(c[1]).map(function (r) {
        return '<tr><td class="t">' + esc(r[0]) + '</td><td class="num">' + n(r[1]) + "</td></tr>";
      });
      return '<div class="mini">' + table([[c[0], 0], ["횟수", 1]], rows, "데이터 없음", "ch" + i, 5) +
        "</div>";
    }).join("") + "</div>"));

  H.push('<div class="grid2 cards">');
  H.push(card("페이지", "",
    table([["경로", 0], ["PV", 1], ["체류", 1]],
      Object.keys(a.pages).map(function (k) { return [k, a.pages[k]]; })
        .sort(function (x, y) { return y[1][1] - x[1][1] || y[1][0] - x[1][0]; })
        .map(function (r) {
          return '<tr><td class="t">' + pageLabel(r[0]) + '</td><td class="num">' + n(r[1][0]) +
            '</td><td class="num">' + dur(r[1][1]) + "</td></tr>";
        }), "", "pages", 10)));
  H.push(card("이벤트", "",
    table([["이름", 0], ["횟수", 1]], sorted(ev).map(function (r) {
      return "<tr><td>" + esc(r[0]) + '</td><td class="num">' + n(r[1]) + "</td></tr>"; }),
      "", "ev", 10)));
  H.push("</div>");

  document.getElementById("app").innerHTML = H.join("");
  setupPagers();
}
</script>
